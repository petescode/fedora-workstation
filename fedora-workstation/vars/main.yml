---
unwanted_packages:
  - "decibels" # audio player app
  - "gnome-boxes"
  - "gnome-contacts"
  - "gnome-connections" # the connections app is a remote desktop app
  - "gnome-maps"
  - "gnome-remote-desktop" # another remote desktop app
  - "gnome-tour"
  - "gnome-weather"
  - "malcontent-control" # parental control app
  - "showtime" # video player app
  - "snapshot" # camera app

packages:
  - "ansible"
  - "code"
  - "darktable"
  - "dconf-editor"
  - "discord"
  - "dnf-utils"
  - "gnome-tweaks"
  - "golang"
  - "google-chrome-stable"
  - "keepassxc"
  - "libdvdcss"
  - "lshw"
  #- "nautilus-python"
  - "nmap"
  - "nss-tools"
  - "papirus-icon-theme"
  - "perl-Image-ExifTool"
  - "pinta"
  - "python-vlc"
  - "p7zip"
  - "remmina"
  #- "sqlite"
  - "terminator"
  - "vim"
  - "vlc"
  - "wireshark"
  - "wodim"
  - "yt-dlp"

firmware_packages:
  - "alsa-firmware" # for use by ALSA sound drivers
  - "b43-firmware" # broadcom wireless
  - "broadcom-bt-firmware" # broadcom bluetooth
  - "gnome-firmware" # UI frontend for fwupd
  #- "ipu6-camera-bins" # for some Intel processors to interact with integrated webcams
  - "midisport-firmware" # for midi sound equipment
  - "nouveau-firmware" # nVidia GPUs
  - "python3-virt-firmware" # for interacting with virtual filesystems
  - "zd1211-firmware" # some USB wireless devices

user_account: "{{ ansible_env.USERNAME }}"
...